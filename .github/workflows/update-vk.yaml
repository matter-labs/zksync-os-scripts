name: Update verification key

on:
  workflow_call:
    inputs:
      protocol_version:
        description: '[mandatory] Protocol version to update.'
        type: string
        required: true
      zksync_os_tag:
        description: '[optional] OS release tag. Defaults to the selected protocol mapping.'
        type: string
        required: false
      zksync_os_repository:
        description: '[optional] OS release repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      era_contracts_branch:
        description: '[mandatory] Contracts branch or revision to update.'
        type: string
        required: false
      zkos_wrapper_version:
        description: 'Wrapper revision matching the prover. Required for v33.1; v33.2 defaults to the pinned PR #49 revision.'
        type: string
        required: false
      zkos_wrapper_repository:
        description: '[optional] Wrapper repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      commit_changes:
        description: '[mandatory] Whether to commit the contracts changes back to the repository. If set to false, changes will not be committed, but a patch file will be saved as an artifact.'
        type: boolean
        required: false
        default: false
      open_pr:
        description: '[optional] Whether to open a PR for the committed changes. If not, and commit_changes is true, changes will be pushed directly to the chosen branch.'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      protocol_version:
        description: '[mandatory] Protocol version to update.'
        type: choice
        required: true
        default: 'v33.2'
        options:
          - 'v33.1'
          - 'v33.2'
      zksync_os_tag:
        description: '[optional] OS release tag. Defaults to the selected protocol mapping.'
        type: string
        required: false
      zksync_os_repository:
        description: '[optional] OS release repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      era_contracts_branch:
        description: '[mandatory] Contracts branch or revision to update.'
        type: string
        required: false
      zkos_wrapper_version:
        description: 'Wrapper revision matching the prover. Required for v33.1; v33.2 defaults to the pinned PR #49 revision.'
        type: string
        required: false
      zkos_wrapper_repository:
        description: '[optional] Wrapper repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      commit_changes:
        description: '[mandatory] Whether to commit the contracts changes back to the repository. If set to false, changes will not be committed, but a patch file will be saved as an artifact.'
        type: boolean
        required: false
        default: true
      open_pr:
        description: '[optional] Whether to open a PR for the committed changes. If not, and commit_changes is true, changes will be pushed directly to the chosen branch.'
        type: boolean
        required: false
        default: true


permissions:
  contents: read

concurrency:
  group: update-vk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.protocol_version }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -ex {0}

env:
  # v33 shares the v0.5.5 OS release; contracts revisions remain explicit.
  ZKSYNC_FOUNDRY_VERSION_V33: "v0.1.5"
  ZKSYNC_OS_TAG_V33: "v0.5.5"
  ZKOS_WRAPPER_VERSION_V33_2: "f28fbaac166383ef19cabb96ea4c7201a8096cc3"
  # To avoid uv warning about cache
  UV_LINK_MODE: copy
  WORKSPACE: "${{ github.workspace }}/workspace"
  VERBOSE: "true"

jobs:

  check-vk:
    runs-on: matterlabs-ci-runner-high-performance
    name: VK update (${{ inputs.protocol_version }})
    steps:

      - name: Define tools versions
        id: define-versions
        env:
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          OS_TAG: ${{ inputs.zksync_os_tag }}
          OS_REPOSITORY: ${{ inputs.zksync_os_repository }}
          CONTRACTS_BRANCH: ${{ inputs.era_contracts_branch }}
          WRAPPER_VERSION: ${{ inputs.zkos_wrapper_version }}
          WRAPPER_REPOSITORY: ${{ inputs.zkos_wrapper_repository }}
        run: |
          crs_power=24
          case "$PROTOCOL_VERSION" in
            v33.1)
              : "${WRAPPER_VERSION:?v33.1 requires a wrapper revision matching the prover}"
              crs_power=25
              ;;
            v33.2) WRAPPER_VERSION="${WRAPPER_VERSION:-$ZKOS_WRAPPER_VERSION_V33_2}" ;;
            *) echo "Unsupported protocol version: $PROTOCOL_VERSION"; exit 1 ;;
          esac
          : "${CONTRACTS_BRANCH:?$PROTOCOL_VERSION requires an explicit contracts branch}"
          echo "zksync_foundry_version=$ZKSYNC_FOUNDRY_VERSION_V33" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_version=$WRAPPER_VERSION" >> "$GITHUB_OUTPUT"
          echo "era_contracts_version=$CONTRACTS_BRANCH" >> "$GITHUB_OUTPUT"
          echo "zksync_os_tag=${OS_TAG:-$ZKSYNC_OS_TAG_V33}" >> "$GITHUB_OUTPUT"
          echo "zksync_os_repository=${OS_REPOSITORY:-matter-labs/zksync-os-private}" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_repository=${WRAPPER_REPOSITORY:-matter-labs/zksync-protocol-private}" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_crs_power=$crs_power" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          zksync_foundry_version: ${{ steps.define-versions.outputs.zksync_foundry_version }}

      # The existing org read token cannot fetch the private protocol repository.
      # Use the repository's configured bot app with read-only, explicit repo scope.
      - name: Generate private dependency token
        id: private-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MATTERLABS_BOTS_APP_ID }}
          private-key: ${{ secrets.MATTERLABS_BOTS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read
          repositories: |
            zksync-protocol-private
            zksync-airbender-private
            zksync-os-private

      # The public contracts repo is outside the private app installation.
      - name: Checkout contracts
        uses: ./.github/actions/checkout-deps
        with:
          github_token: ${{ inputs.commit_changes && secrets.RELEASE_TOKEN || github.token }}
          era_contracts_version: ${{ steps.define-versions.outputs.era_contracts_version }}

      - name: Checkout dependencies
        uses: ./.github/actions/checkout-deps
        with:
          github_token: ${{ steps.private-token.outputs.token }}
          zkos_wrapper_version: ${{ steps.define-versions.outputs.zkos_wrapper_version }}
          zkos_wrapper_repository: ${{ steps.define-versions.outputs.zkos_wrapper_repository }}

      - name: Configure private dependency authentication
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: gh auth setup-git --hostname github.com

      - name: Record generation inputs
        env:
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          OS_REPOSITORY: ${{ steps.define-versions.outputs.zksync_os_repository }}
          OS_TAG: ${{ steps.define-versions.outputs.zksync_os_tag }}
          WRAPPER_REPOSITORY: ${{ steps.define-versions.outputs.zkos_wrapper_repository }}
          CRS_POWER: ${{ steps.define-versions.outputs.zkos_wrapper_crs_power }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          def revision(path):
              return subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
          manifest = {key.lower(): os.environ[key] for key in (
              "PROTOCOL_VERSION", "OS_REPOSITORY", "OS_TAG", "WRAPPER_REPOSITORY", "CRS_POWER"
          )}
          manifest.update(wrapper_revision=revision(workspace / "zkos-wrapper"),
                          contracts_revision=revision(workspace / "era-contracts"),
                          scripts_revision=revision(pathlib.Path.cwd()))
          (workspace / "generation-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PYTHON

      - name: Update vk
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          ZKSYNC_OS_TAG: ${{ steps.define-versions.outputs.zksync_os_tag }}
          ZKSYNC_OS_REPOSITORY: ${{ steps.define-versions.outputs.zksync_os_repository }}
          ZKOS_WRAPPER_CRS_POWER: ${{ steps.define-versions.outputs.zkos_wrapper_crs_power }}
          RUST_MIN_STACK: '268435456'
        run: |
          REPO_DIR=${WORKSPACE}/era-contracts \
          ZKOS_WRAPPER_PATH=${WORKSPACE}/zkos-wrapper \
            uv run -m scripts.update_vk

      - name: Save git patch
        if: success()
        working-directory: ${{ env.WORKSPACE }}/era-contracts
        run: git diff > "${GITHUB_WORKSPACE}/era_contracts_${{ inputs.protocol_version }}.patch"

      - name: Upload git patch
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: era-contracts-patch-${{ inputs.protocol_version }}
          path: "era_contracts_${{ inputs.protocol_version }}.patch"

      - name: Upload verification key
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: verification-key-${{ inputs.protocol_version }}
          path: |
            ${{ env.WORKSPACE }}/snark_vk_expected.json
            ${{ env.WORKSPACE }}/vk_hash.txt
            ${{ env.WORKSPACE }}/risc_wrapper_vk.json
            ${{ env.WORKSPACE }}/compression_vk.json
            ${{ env.WORKSPACE }}/generation-manifest.json
          if-no-files-found: error

      - name: Commit era-contracts changes
        if: success() && inputs.commit_changes
        working-directory: ${{ env.WORKSPACE }}/era-contracts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT_TITLE: "chore: update verification keys for protocol ${{ inputs.protocol_version }}"
        run: |
          if [[ "${{ inputs.open_pr }}" == "true" ]]; then
            BRANCH="update-vk-$(date +%s)"
          fi
          if ! git diff --exit-code --quiet; then
            git config user.name "zksync-os-bot"
            git config user.email "zksync-os-bot@users.noreply.github.com"
            if [ -n "${BRANCH}" ]; then
              git checkout -b "${BRANCH}"
            fi
            git add .
            git commit -m "${{ env.COMMIT_TITLE }}"
            git push --set-upstream origin ${BRANCH:-${{ steps.define-versions.outputs.era_contracts_version }}}
            if [[ "${{ inputs.open_pr }}" == "true" ]]; then
              gh pr create --title "${{ env.COMMIT_TITLE }}" \
                --body "Automated verification keys update for protocol ${{ inputs.protocol_version }}" \
                --base "${{ steps.define-versions.outputs.era_contracts_version }}" \
                --head "${BRANCH}"
            fi
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: era-contracts-update-logs
          path: ${{ github.workspace }}/workspace/.logs/*
