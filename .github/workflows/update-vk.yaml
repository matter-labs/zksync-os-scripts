name: Update verification key

on:
  workflow_call:
    inputs:
      protocol_version:
        description: '[mandatory] Protocol version to update.'
        type: string
        required: true
      zksync_os_tag:
        description: '[optional] OS release tag. Defaults to the selected protocol mapping.'
        type: string
        required: false
      zksync_os_repository:
        description: '[optional] OS release repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      era_contracts_branch:
        description: 'Contracts branch to update. Required for v33.1; otherwise derived from protocol version.'
        type: string
        required: false
      zkos_wrapper_version:
        description: 'Wrapper revision matching the prover. Required for v33.1; otherwise defaults to main.'
        type: string
        required: false
      zkos_wrapper_repository:
        description: '[optional] Wrapper repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      zkos_wrapper_recursion_mode:
        description: '[optional] Wrapper recursion mode. v33.1 defaults to use-reduced-log23-machine.'
        type: string
        required: false
      commit_changes:
        description: '[mandatory] Whether to commit the contracts changes back to the repository. If set to false, changes will not be committed, but a patch file will be saved as an artifact.'
        type: boolean
        required: false
        default: false
      open_pr:
        description: '[optional] Whether to open a PR for the committed changes. If not, and commit_changes is true, changes will be pushed directly to the chosen branch.'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      protocol_version:
        description: '[mandatory] Protocol version to update.'
        type: choice
        required: true
        default: 'v30.2'
        options:
          - 'v30.2'
          - 'v31.0'
          - 'v32.0'
          - 'v33.1'
      zksync_os_tag:
        description: '[optional] OS release tag. Defaults to the selected protocol mapping.'
        type: string
        required: false
      zksync_os_repository:
        description: '[optional] OS release repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      era_contracts_branch:
        description: 'Contracts branch to update. Required for v33.1; otherwise derived from protocol version.'
        type: string
        required: false
      zkos_wrapper_version:
        description: 'Wrapper revision matching the prover. Required for v33.1; otherwise defaults to main.'
        type: string
        required: false
      zkos_wrapper_repository:
        description: '[optional] Wrapper repository (owner/name). Defaults to the selected protocol mapping.'
        type: string
        required: false
      zkos_wrapper_recursion_mode:
        description: '[optional] Wrapper recursion mode. v33.1 defaults to use-reduced-log23-machine.'
        type: string
        required: false
      commit_changes:
        description: '[mandatory] Whether to commit the contracts changes back to the repository. If set to false, changes will not be committed, but a patch file will be saved as an artifact.'
        type: boolean
        required: false
        default: true
      open_pr:
        description: '[optional] Whether to open a PR for the committed changes. If not, and commit_changes is true, changes will be pushed directly to the chosen branch.'
        type: boolean
        required: false
        default: true


permissions:
  contents: read

concurrency:
  group: update-vk-${{ github.event_name }}-${{ github.ref }}-${{ inputs.protocol_version }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -ex {0}

env:
  # Versions mapping for v30
  ZKSYNC_FOUNDRY_VERSION_V30: "nightly-ae913af65381734ad46c044a9495b67310bc77c4"
  ZKOS_WRAPPER_VERSION_V30: "main"
  ERA_CONTRACTS_VERSION_V30: "zksync-os-stable"
  ZKSYNC_OS_TAG_V30: "v0.2.5"
  # Versions mapping for v31
  ZKSYNC_FOUNDRY_VERSION_V31: "v0.1.5"
  ZKOS_WRAPPER_VERSION_V31: "main"
  ERA_CONTRACTS_VERSION_V31: "draft-v31"
  ZKSYNC_OS_TAG_V31: "v0.3.0"
  # Versions mapping for v32
  ZKSYNC_FOUNDRY_VERSION_V32: "v0.1.5"
  ZKOS_WRAPPER_VERSION_V32: "main"
  ERA_CONTRACTS_VERSION_V32: "draft-v32"
  ZKSYNC_OS_TAG_V32: "v0.5.0"
  # v33.1 has no agreed wrapper revision or contracts branch yet; require overrides.
  ZKSYNC_FOUNDRY_VERSION_V33: "v0.1.5"
  ZKSYNC_OS_TAG_V33: "v0.5.5"
  # To avoid uv warning about cache
  UV_LINK_MODE: copy
  WORKSPACE: "${{ github.workspace }}/workspace"
  VERBOSE: "true"

jobs:

  check-vk:
    runs-on: matterlabs-ci-runner-high-performance
    name: VK update (${{ inputs.protocol_version }})
    steps:

      - name: Define tools versions
        id: define-versions
        env:
          PROTOCOL_VERSION: ${{ inputs.protocol_version }}
          OS_TAG: ${{ inputs.zksync_os_tag }}
          OS_REPOSITORY: ${{ inputs.zksync_os_repository }}
          CONTRACTS_BRANCH: ${{ inputs.era_contracts_branch }}
          WRAPPER_VERSION: ${{ inputs.zkos_wrapper_version }}
          WRAPPER_REPOSITORY: ${{ inputs.zkos_wrapper_repository }}
          WRAPPER_RECURSION_MODE: ${{ inputs.zkos_wrapper_recursion_mode }}
        run: |
          case "$PROTOCOL_VERSION" in
            v30.2) series=V30 ;;
            v31.0) series=V31 ;;
            v32.0) series=V32 ;;
            v33.1)
              : "${WRAPPER_VERSION:?v33.1 requires a wrapper revision matching the prover}"
              : "${CONTRACTS_BRANCH:?v33.1 requires an explicit contracts branch}"
              series=V33
              ;;
            *) echo "Unsupported protocol version: $PROTOCOL_VERSION"; exit 1 ;;
          esac
          foundry_var="ZKSYNC_FOUNDRY_VERSION_${series}"
          wrapper_var="ZKOS_WRAPPER_VERSION_${series}"
          contracts_var="ERA_CONTRACTS_VERSION_${series}"
          os_tag_var="ZKSYNC_OS_TAG_${series}"
          if [[ "$series" == V33 ]]; then
            OS_REPOSITORY="${OS_REPOSITORY:-matter-labs/zksync-os-private}"
            WRAPPER_REPOSITORY="${WRAPPER_REPOSITORY:-matter-labs/zkos-wrapper-private}"
            WRAPPER_RECURSION_MODE="${WRAPPER_RECURSION_MODE:-use-reduced-log23-machine}"
          fi
          echo "zksync_foundry_version=${!foundry_var}" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_version=${WRAPPER_VERSION:-${!wrapper_var}}" >> "$GITHUB_OUTPUT"
          echo "era_contracts_version=${CONTRACTS_BRANCH:-${!contracts_var}}" >> "$GITHUB_OUTPUT"
          echo "zksync_os_tag=${OS_TAG:-${!os_tag_var}}" >> "$GITHUB_OUTPUT"
          echo "zksync_os_repository=${OS_REPOSITORY:-matter-labs/zksync-os}" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_repository=${WRAPPER_REPOSITORY:-matter-labs/zkos-wrapper}" >> "$GITHUB_OUTPUT"
          echo "zkos_wrapper_recursion_mode=$WRAPPER_RECURSION_MODE" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup runner
        uses: ./.github/actions/runner-setup
        with:
          zksync_foundry_version: ${{ steps.define-versions.outputs.zksync_foundry_version }}

      - name: Checkout dependencies
        uses: ./.github/actions/checkout-deps
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          zkos_wrapper_version: ${{ steps.define-versions.outputs.zkos_wrapper_version }}
          zkos_wrapper_repository: ${{ steps.define-versions.outputs.zkos_wrapper_repository }}
          era_contracts_version: ${{ steps.define-versions.outputs.era_contracts_version }}

      - name: Configure private dependency authentication
        shell: bash -e {0}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -n "$GH_TOKEN" ]]; then
            gh auth setup-git --hostname github.com
          fi

      - name: Update vk
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          ZKSYNC_OS_TAG: ${{ steps.define-versions.outputs.zksync_os_tag }}
          ZKSYNC_OS_REPOSITORY: ${{ steps.define-versions.outputs.zksync_os_repository }}
          ZKOS_WRAPPER_RECURSION_MODE: ${{ steps.define-versions.outputs.zkos_wrapper_recursion_mode }}
        run: |
          REPO_DIR=${WORKSPACE}/era-contracts \
          ZKOS_WRAPPER_PATH=${WORKSPACE}/zkos-wrapper \
            uv run -m scripts.update_vk

      - name: Save git patch
        if: success()
        working-directory: ${{ env.WORKSPACE }}/era-contracts
        run: git diff > "${GITHUB_WORKSPACE}/era_contracts_${{ inputs.protocol_version }}.patch"

      - name: Upload git patch
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: era-contracts-patch-${{ inputs.protocol_version }}
          path: "era_contracts_${{ inputs.protocol_version }}.patch"

      - name: Upload verification key
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: verification-key-${{ inputs.protocol_version }}
          path: |
            ${{ env.WORKSPACE }}/snark_vk_expected.json
            ${{ env.WORKSPACE }}/vk_hash.txt
          if-no-files-found: error

      - name: Commit era-contracts changes
        if: success() && inputs.commit_changes
        working-directory: ${{ env.WORKSPACE }}/era-contracts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMMIT_TITLE: "chore: update verification keys for protocol ${{ inputs.protocol_version }}"
        run: |
          if [[ "${{ inputs.open_pr }}" == "true" ]]; then
            BRANCH="update-vk-$(date +%s)"
          fi
          if ! git diff --exit-code --quiet; then
            git config user.name "zksync-os-bot"
            git config user.email "zksync-os-bot@users.noreply.github.com"
            if [ -n "${BRANCH}" ]; then
              git checkout -b "${BRANCH}"
            fi
            git add .
            git commit -m "${{ env.COMMIT_TITLE }}"
            git push --set-upstream origin ${BRANCH:-${{ steps.define-versions.outputs.era_contracts_version }}}
            if [[ "${{ inputs.open_pr }}" == "true" ]]; then
              gh pr create --title "${{ env.COMMIT_TITLE }}" \
                --body "Automated verification keys update for protocol ${{ inputs.protocol_version }}" \
                --base "${{ steps.define-versions.outputs.era_contracts_version }}" \
                --head "${BRANCH}"
            fi
          fi

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f4 # v6.0.0
        with:
          name: era-contracts-update-logs
          path: ${{ github.workspace }}/workspace/.logs/*
